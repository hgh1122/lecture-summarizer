<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}강의 영상 요약기{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 0 auto; padding: 24px; color: #222; line-height: 1.6; }
    a { color: #2563eb; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #ddd; margin-bottom: 24px; }
    header h1 { font-size: 22px; margin: 12px 0; }
    .muted { color: #777; font-size: 14px; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    input[type=url] { width: 70%; padding: 10px; font-size: 15px; }
    button { padding: 10px 18px; font-size: 15px; background: #f97316; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #bbb; }
    .slide { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    .slide img { width: 100%; border: 1px solid #ddd; border-radius: 4px; }
    .time { font-family: monospace; font-size: 13px; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    blockquote { margin: 8px 0 0; padding-left: 12px; border-left: 3px solid #ddd; color: #555; }
    .status { padding: 12px; border-radius: 6px; background: #f3f4f6; }
    .status.failed { background: #fee2e2; }
    .status.done { background: #dcfce7; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="color:inherit;text-decoration:none">강의 영상 요약기</a></h1>
    <a href="/sample" class="muted">샘플 데이터로 보기</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
